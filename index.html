const naira = (n) => "₦" + n.toLocaleString("en-NG");

// Text color for chips overlaid directly on product photos (those chips keep a
// dark background regardless of site theme, so their text must stay light).
const CHIP_TEXT = "#F5F1E6";

const SIZES = [
  { code: "S", surcharge: 0 },
  { code: "M", surcharge: 0 },
  { code: "L", surcharge: 0 },
  { code: "XL", surcharge: 0 },
  { code: "XXL", surcharge: 1000 },
  { code: "XXXL", surcharge: 3000 },
];

function ContourField({ opacity = 0.5, onDark = false }) {
  // layered concentric "topographic" rings via radial-gradients
  const rings = (cx, cy, color) =>
    `repeating-radial-gradient(circle at ${cx}% ${cy}%, transparent 0, transparent 26px, ${color} 27px, transparent 28px)`;
  const ringColors = onDark
    ? ["rgba(185,28,28,0.08)", "rgba(237,231,217,0.05)", "rgba(237,231,217,0.035)"]
    : ["rgba(185,28,28,0.10)", "rgba(23,22,15,0.05)", "rgba(23,22,15,0.035)"];
  return (
    <div
      aria-hidden="true"
      style={{
        position: "absolute",
        inset: 0,
        opacity,
        backgroundImage: [
          rings(20, 30, ringColors[0]),
          rings(80, 70, ringColors[1]),
          rings(50, 15, ringColors[2]),
        ].join(","),
        pointerEvents: "none",
      }}
    />
  );
}

function Marquee() {
  const text = "NEW DROP · IBADAN BASE · LIMITED RUN · DEFINE YOUR OWN PATH · WORLDWIDE SHIPPING SOON · ";
  return (
    <div
      style={{ background: C.brass, color: C.paper, borderTop: `1px solid ${C.line}`, borderBottom: `1px solid ${C.line}` }}
      className="overflow-hidden whitespace-nowrap py-2"
    >
      <div style={{ display: "inline-block", animation: "marquee 22s linear infinite" }}>
        <span className="tracking-widest text-xs font-bold uppercase mx-2">{text.repeat(4)}</span>
      </div>
      <style>{`@keyframes marquee {0%{transform:translateX(0)}100%{transform:translateX(-50%)}}`}</style>
    </div>
  );
}

function ProductCard({ p, onAdd }) {
  const [view, setView] = useState("front"); // "front" | "back"
  const [size, setSize] = useState("M");
  const sizeInfo = SIZES.find((s) => s.code === size);
  const finalPrice = p.price + sizeInfo.surcharge;

  return (
    <div
      style={{ border: `1px solid ${C.line}`, background: C.surface }}
      className="flex flex-col"
    >
      <div
        style={{
          height: 420,
          background: C.bg,
          position: "relative",
          overflow: "hidden",
        }}
      >
        <img
          src={view === "front" ? p.front : p.back}
          alt={`${p.name} — ${view}`}
          style={{
            width: "100%",
            height: "100%",
            objectFit: "contain",
            objectPosition: "center",
          }}
        />
        <span
          style={{
            position: "absolute",
            top: 10,
            left: 10,
            fontFamily: "'Space Mono', monospace",
            fontSize: 11,
            letterSpacing: "0.08em",
            color: CHIP_TEXT,
            border: `1px solid ${C.line}`,
            padding: "2px 6px",
            background: "rgba(10,10,8,0.7)",
          }}
        >
          {p.code}
        </span>

        <div
          style={{
            position: "absolute",
            bottom: 10,
            left: "50%",
            transform: "translateX(-50%)",
            display: "flex",
            border: `1px solid ${C.line}`,
            background: "rgba(10,10,8,0.85)",
          }}
        >
          <button
            onClick={() => setView("front")}
            style={{
              color: view === "front" ? C.paper : CHIP_TEXT,
              background: view === "front" ? C.brass : "transparent",
              fontFamily: "'Space Mono', monospace",
              fontSize: 11,
              letterSpacing: "0.08em",
            }}
            className="px-3 py-1.5 uppercase"
          >
            Front
          </button>
          <button
            onClick={() => setView("back")}
            style={{
              color: view === "back" ? C.paper : CHIP_TEXT,
              background: view === "back" ? C.brass : "transparent",
              fontFamily: "'Space Mono', monospace",
              fontSize: 11,
              letterSpacing: "0.08em",
            }}
            className="px-3 py-1.5 uppercase"
          >
            Back
          </button>
        </div>
      </div>
      <div className="p-4 flex flex-col gap-3 flex-1">
        <div className="flex items-start justify-between gap-2">
          <h3 style={{ color: C.paper, fontFamily: "'Anton', sans-serif" }} className="text-lg uppercase leading-tight">
            {p.name}
          </h3>
        </div>

        <div>
          <span style={{ color: C.paperDim, fontFamily: "'Space Mono', monospace" }} className="text-xs uppercase tracking-widest">
            Size
          </span>
          <div className="flex flex-wrap gap-2 mt-2">
            {SIZES.map((s) => (
              <button
                key={s.code}
                onClick={() => setSize(s.code)}
                style={{
                  border: `1px solid ${size === s.code ? C.brass : C.line}`,
                  color: size === s.code ? C.brass : C.paperDim,
                  fontFamily: "'Space Mono', monospace",
                }}
                className="text-xs px-2 py-1"
              >
                {s.code}
                {s.surcharge > 0 ? ` +${naira(s.surcharge)}` : ""}
              </button>
            ))}
          </div>
        </div>

        <div className="flex items-center justify-between mt-auto">
          <span style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }} className="text-sm">
            {naira(finalPrice)}
          </span>
          <button
            onClick={() => onAdd(p, size, finalPrice)}
            style={{ border: `1px solid ${C.brass}`, color: C.brass }}
            className="text-xs uppercase tracking-widest px-3 py-2 transition-colors"
            onMouseEnter={(e) => { e.currentTarget.style.background = C.brass; e.currentTarget.style.color = C.paper; }}
            onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = C.brass; }}
          >
            Add
          </button>
        </div>
      </div>
    </div>
  );
}

function UnchartedStore() {
  const [menuOpen, setMenuOpen] = useState(false);
  const [cartOpen, setCartOpen] = useState(false);
  const [cart, setCart] = useState([]);
  const [email, setEmail] = useState("");

  const [checkoutEmail, setCheckoutEmail] = useState("");
  const [paystackReady, setPaystackReady] = useState(false);
  const [paystackLoading, setPaystackLoading] = useState(false);
  const [paystackError, setPaystackError] = useState("");
  const [paystackStatus, setPaystackStatus] = useState(null); // null | "paid"

  // without ever leaving the site.
  useEffect(() => {
    if (window.PaystackPop) {
      setPaystackReady(true);
      return;
    }
    const script = document.createElement("script");
    script.src = "https://js.paystack.co/v1/inline.js";
    script.async = true;
    script.onload = () => setPaystackReady(true);
    script.onerror = () => setPaystackError("Couldn't load the payment widget. Check your connection and try again.");
    document.body.appendChild(script);
  }, []);

  const payWithPaystack = () => {
    setPaystackError("");

    if (!PAYSTACK_PUBLIC_KEY) {
      setPaystackError("Payments aren't configured yet. Try Pay via Transfer instead.");
      return;
    }
    if (!checkoutEmail || !checkoutEmail.includes("@")) {
      setPaystackError("Enter a valid email above so we can send your receipt.");
      return;
    }
    if (!paystackReady || !window.PaystackPop) {
      setPaystackError("Payment widget is still loading — try again in a moment.");
      return;
    }

    setPaystackLoading(true);
    const reference = `UN-${Date.now()}`;

    const handler = window.PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email: checkoutEmail,
      amount: Math.round(total * 100), // Paystack expects kobo
      currency: "NGN",
      ref: reference,
      metadata: {
        custom_fields: [
          {
            display_name: "Order",
            variable_name: "order",
            value: cart.map((i) => `${i.qty}x ${i.name} (${i.size})`).join(", "),
          },
          { display_name: "Delivery to", variable_name: "delivery", value: location },
          { display_name: "Address", variable_name: "address", value: locationNote || "Not provided" },
        ],
      },
      callback: (response) => {
        setPaystackLoading(false);
        setPaystackStatus("paid");
        const lines = cart.map((i) => `${i.qty}x ${i.name} — Size ${i.size} (${i.code})`);
        const message = `Hi Uncharted, I just paid via Paystack for:\n${lines.join("\n")}\n\nDelivery to: ${location} (${naira(deliveryFee)})${locationNote ? `\nAddress: ${locationNote}` : ""}\nTotal paid: ${naira(total)}\nReference: ${response.reference}\n\nAttaching my payment screenshot now.`;
        // brief pause so the "Payment received!" banner is actually seen before we navigate away
        setTimeout(() => {
          window.location.href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`;
        }, 900);
      },
      onClose: () => setPaystackLoading(false),
    });
    handler.openIframe();
  };

  const addToCart = (p, size, finalPrice) => {
    setCart((prev) => {
      const cartKey = `${p.id}-${size}`;
      const found = prev.find((i) => i.cartKey === cartKey);
      if (found) return prev.map((i) => (i.cartKey === cartKey ? { ...i, qty: i.qty + 1 } : i));
      return [...prev, { ...p, size, price: finalPrice, qty: 1, cartKey }];
    });
    setCartOpen(true);
  };

  const changeQty = (cartKey, delta) => {
    setCart((prev) =>
      prev
        .map((i) => (i.cartKey === cartKey ? { ...i, qty: i.qty + delta } : i))
        .filter((i) => i.qty > 0)
    );
  };

  const removeItem = (cartKey) => setCart((prev) => prev.filter((i) => i.cartKey !== cartKey));

  const [location, setLocation] = useState("Ibadan");
  const [locationNote, setLocationNote] = useState("");
  const deliveryFee = useMemo(() => DELIVERY.find((d) => d.label === location)?.fee ?? 0, [location]);

  const subtotal = useMemo(() => cart.reduce((s, i) => s + i.price * i.qty, 0), [cart]);
  const total = useMemo(() => subtotal + (cart.length ? deliveryFee : 0), [subtotal, deliveryFee, cart.length]);
  const cartCount = useMemo(() => cart.reduce((s, i) => s + i.qty, 0), [cart]);

    const lines = cart.map((i) => `${i.qty}x ${i.name} — Size ${i.size} (${i.code})`);

                  <div style={{ background: C.bg, border: `1px solid ${C.line}` }} className="p-4 mb-3">
                    <div className="flex items-center justify-between text-sm mb-2">
                      <span style={{ color: C.paperDim }}>Bank</span>
                      <span style={{ color: C.paper }}>{BANK.bank}</span>
                    </div>
                    <div className="flex items-center justify-between text-sm mb-2">
                      <span style={{ color: C.paperDim }}>Account name</span>
                      <span style={{ color: C.paper }}>{BANK.accountName}</span>
                    </div>
                    <div className="flex items-center justify-between text-sm">
                      <span style={{ color: C.paperDim }}>Account number</span>
                      <button
                        onClick={copyAccountNumber}
                        style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }}
                        className="font-bold"
                      >
                        {copied ? "Copied!" : BANK.accountNumber}
                      </button>
                    </div>
                  </div>
                  <a
                    href={waLink(paidMessage)}
                    style={{ background: cart.length ? C.brass : C.line, color: cart.length ? C.paper : C.paperDim, pointerEvents: cart.length ? "auto" : "none" }}
                    className="w-full flex items-center justify-center gap-2 py-3 text-xs font-bold uppercase tracking-widest"
                  >
                    <MessageCircle size={14} /> I've paid — confirm on WhatsApp
                  </a>
                  <p style={{ color: C.paperDim, fontSize: 11 }} className="mt-3 text-center">
                    Transfer the total above, then tap to send us your receipt on WhatsApp.
                  </p>
                </>
              )}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<UnchartedStore />);
</script>
</body>
</html>
