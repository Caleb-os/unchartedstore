const naira = (n) => "₦" + n.toLocaleString("en-NG");

// Text color for chips overlaid directly on product photos (those chips keep a
// dark background regardless of site theme, so their text must stay light).
const CHIP_TEXT = "#F5F1E6";

const SIZES = [
  { code: "S", surcharge: 0 },
  { code: "M", surcharge: 0 },
  { code: "L", surcharge: 0 },
  { code: "XL", surcharge: 0 },
  { code: "XXL", surcharge: 1000 },
  { code: "XXXL", surcharge: 3000 },
];

function ContourField({ opacity = 0.5, onDark = false }) {
  // layered concentric "topographic" rings via radial-gradients
  const rings = (cx, cy, color) =>
    `repeating-radial-gradient(circle at ${cx}% ${cy}%, transparent 0, transparent 26px, ${color} 27px, transparent 28px)`;
  const ringColors = onDark
    ? ["rgba(185,28,28,0.08)", "rgba(237,231,217,0.05)", "rgba(237,231,217,0.035)"]
    : ["rgba(185,28,28,0.10)", "rgba(23,22,15,0.05)", "rgba(23,22,15,0.035)"];
  return (
    <div
      aria-hidden="true"
      style={{
        position: "absolute",
        inset: 0,
        opacity,
        backgroundImage: [
          rings(20, 30, ringColors[0]),
          rings(80, 70, ringColors[1]),
          rings(50, 15, ringColors[2]),
        ].join(","),
        pointerEvents: "none",
      }}
    />
  );
}

function Marquee() {
  const text = "NEW DROP · LIMITED RUN · DEFINE YOUR OWN PATH · WORLDWIDE SHIPPING SOON · ";
  return (
    <div
      style={{ background: C.brass, color: C.paper, borderTop: `1px solid ${C.line}`, borderBottom: `1px solid ${C.line}` }}
      className="overflow-hidden whitespace-nowrap py-2"
    >
      <div style={{ display: "inline-block", animation: "marquee 22s linear infinite" }}>
        <span className="tracking-widest text-xs font-bold uppercase mx-2">{text.repeat(4)}</span>
      </div>
      <style>{`@keyframes marquee {0%{transform:translateX(0)}100%{transform:translateX(-50%)}}`}</style>
    </div>
  );
}

function ProductCard({ p, onAdd }) {
  const [view, setView] = useState("front"); // "front" | "back"
  const [size, setSize] = useState("M");
  const sizeInfo = SIZES.find((s) => s.code === size);

function UnchartedStore() {
  const [menuOpen, setMenuOpen] = useState(false);
  const [cartOpen, setCartOpen] = useState(false);
  const [cart, setCart] = useState([]);
  const [email, setEmail] = useState("");
  const [subscribed, setSubscribed] = useState(false);

  // --- Paystack payment gateway state ---
  const [checkoutEmail, setCheckoutEmail] = useState("");
  const [paystackReady, setPaystackReady] = useState(false);
  const [paystackLoading, setPaystackLoading] = useState(false);
  const [paystackError, setPaystackError] = useState("");
  const [paystackStatus, setPaystackStatus] = useState(null); // null | "paid"

  // Load Paystack's inline checkout script once, so payment happens in a popup
  // without ever leaving the site.
  useEffect(() => {
    if (window.PaystackPop) {
      setPaystackReady(true);
      return;
    }
    const script = document.createElement("script");
    script.src = "https://js.paystack.co/v1/inline.js";
    script.async = true;
    script.onload = () => setPaystackReady(true);
    script.onerror = () => setPaystackError("Couldn't load the payment widget. Check your connection and try again.");
    document.body.appendChild(script);
  }, []);

  const payWithPaystack = () => {
    setPaystackError("");

    if (!PAYSTACK_PUBLIC_KEY) {
      setPaystackError("Payments aren't configured yet. Try Pay via Transfer instead.");
      return;
    }
    if (!checkoutEmail || !checkoutEmail.includes("@")) {
      setPaystackError("Enter a valid email above so we can send your receipt.");
      return;
    }
    if (!paystackReady || !window.PaystackPop) {
      setPaystackError("Payment widget is still loading — try again in a moment.");
      return;
    }

    setPaystackLoading(true);
    const reference = `UN-${Date.now()}`;

    const handler = window.PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email: checkoutEmail,
      amount: Math.round(total * 100), // Paystack expects kobo
      currency: "NGN",
      ref: reference,
      metadata: {
        custom_fields: [
          {
            display_name: "Order",
            variable_name: "order",
            value: cart.map((i) => `${i.qty}x ${i.name} (${i.size})`).join(", "),
          },
          { display_name: "Delivery to", variable_name: "delivery", value: location },
          { display_name: "Address & Contact", variable_name: "address", value: locationNote || "Not provided" },
        ],
      },
      callback: (response) => {
        setPaystackLoading(false);
        setPaystackStatus("paid");
        const lines = cart.map((i) => `${i.qty}x ${i.name} — Size ${i.size} (${i.code})`);
        const message = `Hi Uncharted, I just paid via Paystack for:\n${lines.join("\n")}\n\nDelivery to: ${location} (${naira(deliveryFee)})${locationNote ? `\nAddress & Contact: ${locationNote}` : ""}\nTotal paid: ${naira(total)}\nReference: ${response.reference}\n\nAttaching my payment screenshot now.`;
        // brief pause so the "Payment received!" banner is actually seen before we navigate away
        setTimeout(() => {
          window.location.href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`;
        }, 900);
      },
      onClose: () => setPaystackLoading(false),
    });
    handler.openIframe();
  };

  const addToCart = (p, size, finalPrice) => {
    setCart((prev) => {
      const cartKey = `${p.id}-${size}`;
      const found = prev.find((i) => i.cartKey === cartKey);
      if (found) return prev.map((i) => (i.cartKey === cartKey ? { ...i, qty: i.qty + 1 } : i));
      return [...prev, { ...p, size, price: finalPrice, qty: 1, cartKey }];
    });
    setCartOpen(true);
  };

  const changeQty = (cartKey, delta) => {
    setCart((prev) =>
      prev
        .map((i) => (i.cartKey === cartKey ? { ...i, qty: i.qty + delta } : i))
        .filter((i) => i.qty > 0)
    );
  };

  const removeItem = (cartKey) => setCart((prev) => prev.filter((i) => i.cartKey !== cartKey));

  const [location, setLocation] = useState("Ibadan");
  const [locationNote, setLocationNote] = useState("");
  const deliveryFee = useMemo(() => DELIVERY.find((d) => d.label === location)?.fee ?? 0, [location]);

  const subtotal = useMemo(() => cart.reduce((s, i) => s + i.price * i.qty, 0), [cart]);
  const total = useMemo(() => subtotal + (cart.length ? deliveryFee : 0), [subtotal, deliveryFee, cart.length]);
  const cartCount = useMemo(() => cart.reduce((s, i) => s + i.qty, 0), [cart]);

  const paidMessage = useMemo(() => {
    const lines = cart.map((i) => `${i.qty}x ${i.name} — Size ${i.size} (${i.code})`);
    return `Hi Uncharted, I've sent ${naira(total)} via ${BANK.bank} for:\n${lines.join("\n")}\n\nDelivery to: ${location} (${naira(deliveryFee)})${locationNote ? `\nAddress & Contact: ${locationNote}` : ""}\n\nAttaching my receipt now.`;
  }, [cart, total, location, deliveryFee, locationNote]);

                    <div className="flex-1">
                      <div className="flex items-start justify-between gap-2">
                        <p style={{ color: C.paper }} className="text-sm font-medium">{i.name}</p>
                        <button onClick={() => removeItem(i.cartKey)} aria-label={`Remove ${i.name}`}>
                          <Trash2 size={15} style={{ color: C.paperDim }} />
                        </button>
                      </div>
                      <p style={{ color: C.paperDim, fontFamily: "'Space Mono', monospace" }} className="text-xs mt-1">{i.code} · Size {i.size} · {naira(i.price)}</p>
                      <div className="flex items-center gap-3 mt-2">
                        <button onClick={() => changeQty(i.cartKey, -1)} style={{ border: `1px solid ${C.line}` }} className="w-6 h-6 flex items-center justify-center">
                          <Minus size={12} />
                        </button>
                        <span style={{ fontFamily: "'Space Mono', monospace" }} className="text-xs">{i.qty}</span>
                        <button onClick={() => changeQty(i.cartKey, 1)} style={{ border: `1px solid ${C.line}` }} className="w-6 h-6 flex items-center justify-center">
                          <Plus size={12} />
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
              <div style={{ borderTop: `1px solid ${C.line}` }} className="p-5">
                <div className="mb-4">
                  <span style={{ color: C.paperDim, fontFamily: "'Space Mono', monospace" }} className="text-xs uppercase tracking-widest">
                    Delivery location
                  </span>
                  <select
                    value={location}
                    onChange={(e) => setLocation(e.target.value)}
                    style={{ background: C.bg, border: `1px solid ${C.line}`, color: C.paper }}
                    className="w-full mt-2 px-3 py-2 text-sm outline-none"
                >
                  {DELIVERY.map((d) => (
                    <option key={d.label} value={d.label}>
                      {d.label} — {naira(d.fee)}
                    </option>
                  ))}
                </select>

                  <span style={{ color: C.paperDim, fontFamily: "'Space Mono', monospace" }} className="text-xs uppercase tracking-widest mt-4 block">
                    Address & contact info
                  </span>
                  <textarea
                    value={locationNote}
                    onChange={(e) => setLocationNote(e.target.value)}
                    placeholder="Exact address (street, area, landmark) and a phone number we can reach you on for delivery"
                    rows={3}
                    style={{ background: C.bg, border: `1px solid ${C.line}`, color: C.paper }}
                    className="w-full mt-2 px-3 py-2 text-sm outline-none resize-none"
                  />
              </div>

              <div className="flex items-center justify-between text-sm mb-1">
                <span style={{ color: C.paperDim }}>Subtotal</span>
                <span style={{ color: C.paper, fontFamily: "'Space Mono', monospace" }}>{naira(subtotal)}</span>
              </div>
              <div className="flex items-center justify-between text-sm mb-3">
                <span style={{ color: C.paperDim }}>Delivery ({location})</span>
                <span style={{ color: C.paper, fontFamily: "'Space Mono', monospace" }}>{naira(cart.length ? deliveryFee : 0)}</span>
              </div>
              <div className="flex items-center justify-between mb-4" style={{ borderTop: `1px solid ${C.line}`, paddingTop: 10 }}>
                <span style={{ color: C.paperDim }} className="text-sm uppercase tracking-widest">Total</span>
                <span style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }} className="text-lg">{naira(total)}</span>
              </div>

              {paystackStatus === "paid" && (
                <div
                  style={{ background: "rgba(34,150,80,0.1)", border: "1px solid #229650" }}
                  className="flex items-start gap-2 p-3 mb-4"
                >
                  <CheckCircle size={16} style={{ color: "#229650", flexShrink: 0, marginTop: 1 }} />
                  <p style={{ color: "#229650" }} className="text-xs font-bold uppercase tracking-wide leading-snug">
                    Payment received! Redirecting you to WhatsApp with your order details...
                  </p>
                </div>
              )}

              <input
                type="email"
                value={checkoutEmail}
                onChange={(e) => setCheckoutEmail(e.target.value)}
                placeholder="Your email (for receipt)"
                style={{ background: C.bg, border: `1px solid ${C.line}`, color: C.paper }}
                className="w-full px-3 py-2 mb-3 text-sm outline-none"
              />

              <button
                onClick={payWithPaystack}
                disabled={!cart.length || paystackLoading}
                style={{
                  background: cart.length ? C.brass : C.line,
                  color: cart.length ? C.paper : C.paperDim,
                  opacity: paystackLoading ? 0.7 : 1,
                }}
                className="w-full flex items-center justify-center gap-2 py-3 mb-2 text-xs font-bold uppercase tracking-widest"
              >
                {paystackLoading ? <Loader2 size={14} className="animate-spin" /> : <CreditCard size={14} />}
                {paystackLoading ? "Opening secure checkout..." : "Pay with Paystack"}
              </button>
              {paystackError && (
                <p style={{ color: C.rust }} className="text-xs text-center mb-3">
                  {paystackError}
                </p>
              )}
              <p style={{ color: C.paperDim, fontSize: 11 }} className="text-center mb-4">
                Card, bank transfer, or USSD — handled securely by Paystack, right on this page.
              </p>

              <div
                style={{ background: "rgba(185,28,28,0.1)", border: `1px solid ${C.brass}` }}
                className="flex items-start gap-2 p-3 mb-4"
              >
                <AlertTriangle size={16} style={{ color: C.brass, flexShrink: 0, marginTop: 1 }} />
                <p style={{ color: C.brass }} className="text-xs font-bold uppercase tracking-wide leading-snug">
                  Important! Save a screenshot of your receipt before confirming, and attach it when you message us on WhatsApp — you'll need it if there's ever an issue with your order.
                </p>
              </div>

              <button
                onClick={() => setShowBankDetails((v) => !v)}
                style={{ border: `1px solid ${C.brass}`, color: C.brass, background: showBankDetails ? "rgba(185,28,28,0.1)" : "transparent" }}
                className="w-full flex items-center justify-between px-4 py-3 mb-3 text-xs font-bold uppercase tracking-widest"
              >
                Pay via Transfer (manual)
                {showBankDetails ? <Minus size={14} /> : <Plus size={14} />}
              </button>

              {showBankDetails && (
                <>
                  <div style={{ background: C.bg, border: `1px solid ${C.line}` }} className="p-4 mb-3">
                    <div className="flex items-center justify-between text-sm mb-2">
                      <span style={{ color: C.paperDim }}>Bank</span>
                      <span style={{ color: C.paper }}>{BANK.bank}</span>
                    </div>
                    <div className="flex items-center justify-between text-sm mb-2">
                      <span style={{ color: C.paperDim }}>Account name</span>
                      <span style={{ color: C.paper }}>{BANK.accountName}</span>
                    </div>
                    <div className="flex items-center justify-between text-sm">
                      <span style={{ color: C.paperDim }}>Account number</span>
                      <button
                        onClick={copyAccountNumber}
                        style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }}
                        className="font-bold"
                      >
                        {copied ? "Copied!" : BANK.accountNumber}
                      </button>
                    </div>
                  </div>
                  <a
                    href={waLink(paidMessage)}
                    style={{ background: cart.length ? C.brass : C.line, color: cart.length ? C.paper : C.paperDim, pointerEvents: cart.length ? "auto" : "none" }}
                    className="w-full flex items-center justify-center gap-2 py-3 text-xs font-bold uppercase tracking-widest"
                  >
                    <MessageCircle size={14} /> I've paid — confirm on WhatsApp
                  </a>
                  <p style={{ color: C.paperDim, fontSize: 11 }} className="mt-3 text-center">
                    Transfer the total above, then tap to send us your receipt on WhatsApp.
                  </p>
                </>
              )}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<UnchartedStore />);
</script>
</body>
</html>
