      <svg

        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"

        strokeLinecap="round"
        strokeLinejoin="round"

}

const naira = (n) => "₦" + n.toLocaleString("en-NG");

const SIZES = [
  { code: "S", surcharge: 0 },
  { code: "M", surcharge: 0 },
  { code: "L", surcharge: 0 },
  { code: "XL", surcharge: 0 },
  { code: "XXL", surcharge: 1000 },
  { code: "XXXL", surcharge: 3000 },
];

function ContourField({ opacity = 0.5 }) {
  // layered concentric "topographic" rings via radial-gradients
  const rings = (cx, cy, color) =>
    `repeating-radial-gradient(circle at ${cx}% ${cy}%, transparent 0, transparent 26px, ${color} 27px, transparent 28px)`;
  return (
    <div
      aria-hidden="true"
      style={{
        position: "absolute",
        inset: 0,
        opacity,
        backgroundImage: [
          rings(20, 30, "rgba(201,162,39,0.08)"),
          rings(80, 70, "rgba(237,231,217,0.05)"),
          rings(50, 15, "rgba(237,231,217,0.035)"),
        ].join(","),
        pointerEvents: "none",
      }}
    />
  );
}

function Marquee() {
  const text = "NEW DROP · IBADAN BASE · LIMITED RUN · DEFINE YOUR OWN PATH · WORLDWIDE SHIPPING SOON · ";
  return (
    <div
      style={{ background: C.brass, color: C.bg, borderTop: `1px solid ${C.bg}`, borderBottom: `1px solid ${C.bg}` }}
      className="overflow-hidden whitespace-nowrap py-2"
    >
      <div style={{ display: "inline-block", animation: "marquee 22s linear infinite" }}>
        <span className="tracking-widest text-xs font-bold uppercase mx-2">{text.repeat(4)}</span>
      </div>
      <style>{`@keyframes marquee {0%{transform:translateX(0)}100%{transform:translateX(-50%)}}`}</style>
    </div>
  );
}

function ProductCard({ p, onAdd }) {
  const [view, setView] = useState("front"); // "front" | "back"
  const [size, setSize] = useState("M");
  const sizeInfo = SIZES.find((s) => s.code === size);
  const finalPrice = p.price + sizeInfo.surcharge;

  return (
    <div
      style={{ border: `1px solid ${C.line}`, background: C.surface }}
      className="flex flex-col"
    >
      <div
        style={{
          height: 420,
          background: C.bg,
          position: "relative",
          overflow: "hidden",
        }}
      >
        <img
          src={view === "front" ? p.front : p.back}
          alt={`${p.name} — ${view}`}
          style={{
            width: "100%",
            height: "100%",
            objectFit: "contain",
            objectPosition: "center",
          }}
        />
        <span
          style={{
            position: "absolute",
            top: 10,
            left: 10,
            fontFamily: "'Space Mono', monospace",
            fontSize: 11,
            letterSpacing: "0.08em",
            color: C.paper,
            border: `1px solid ${C.line}`,
            padding: "2px 6px",
            background: "rgba(10,10,8,0.7)",
          }}
        >
          {p.code}
        </span>

        <div
          style={{
            position: "absolute",
            bottom: 10,
            left: "50%",
            transform: "translateX(-50%)",
            display: "flex",
            border: `1px solid ${C.line}`,
            background: "rgba(10,10,8,0.85)",
          }}
        >
          <button
            onClick={() => setView("front")}
            style={{
              color: view === "front" ? C.bg : C.paper,
              background: view === "front" ? C.brass : "transparent",
              fontFamily: "'Space Mono', monospace",
              fontSize: 11,
              letterSpacing: "0.08em",
            }}
            className="px-3 py-1.5 uppercase"
          >
            Front
          </button>
          <button
            onClick={() => setView("back")}
            style={{
              color: view === "back" ? C.bg : C.paper,
              background: view === "back" ? C.brass : "transparent",
              fontFamily: "'Space Mono', monospace",
              fontSize: 11,
              letterSpacing: "0.08em",
            }}
            className="px-3 py-1.5 uppercase"
          >
            Back
          </button>
        </div>
      </div>
      <div className="p-4 flex flex-col gap-3 flex-1">
        <div className="flex items-start justify-between gap-2">
          <h3 style={{ color: C.paper, fontFamily: "'Anton', sans-serif" }} className="text-lg uppercase leading-tight">
            {p.name}
          </h3>
        </div>

        <div>
          <span style={{ color: C.paperDim, fontFamily: "'Space Mono', monospace" }} className="text-xs uppercase tracking-widest">
            Size
          </span>
          <div className="flex flex-wrap gap-2 mt-2">
            {SIZES.map((s) => (
              <button
                key={s.code}
                onClick={() => setSize(s.code)}
                style={{
                  border: `1px solid ${size === s.code ? C.brass : C.line}`,
                  color: size === s.code ? C.brass : C.paperDim,
                  fontFamily: "'Space Mono', monospace",
                }}
                className="text-xs px-2 py-1"
              >
                {s.code}
                {s.surcharge > 0 ? ` +${naira(s.surcharge)}` : ""}
              </button>
            ))}
          </div>
        </div>

        <div className="flex items-center justify-between mt-auto">
          <span style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }} className="text-sm">
            {naira(finalPrice)}
          </span>
          <button
            onClick={() => onAdd(p, size, finalPrice)}
            style={{ border: `1px solid ${C.brass}`, color: C.brass }}
            className="text-xs uppercase tracking-widest px-3 py-2 transition-colors"
            onMouseEnter={(e) => { e.currentTarget.style.background = C.brass; e.currentTarget.style.color = C.bg; }}
            onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = C.brass; }}
          >
            Add
          </button>
        </div>
      </div>
    </div>
  );
}

function UnchartedStore() {
  const [menuOpen, setMenuOpen] = useState(false);
  const [cartOpen, setCartOpen] = useState(false);
  const [cart, setCart] = useState([]);
  const [email, setEmail] = useState("");
  const [subscribed, setSubscribed] = useState(false);

  const addToCart = (p, size, finalPrice) => {
    setCart((prev) => {
      const cartKey = `${p.id}-${size}`;
      const found = prev.find((i) => i.cartKey === cartKey);
      if (found) return prev.map((i) => (i.cartKey === cartKey ? { ...i, qty: i.qty + 1 } : i));
      return [...prev, { ...p, size, price: finalPrice, qty: 1, cartKey }];
    });
    setCartOpen(true);
  };

  const changeQty = (cartKey, delta) => {
    setCart((prev) =>
      prev
        .map((i) => (i.cartKey === cartKey ? { ...i, qty: i.qty + delta } : i))
        .filter((i) => i.qty > 0)
    );
  };

  const removeItem = (cartKey) => setCart((prev) => prev.filter((i) => i.cartKey !== cartKey));

  const [location, setLocation] = useState("Lagos");
  const deliveryFee = useMemo(() => DELIVERY.find((d) => d.label === location)?.fee ?? 0, [location]);

  const subtotal = useMemo(() => cart.reduce((s, i) => s + i.price * i.qty, 0), [cart]);
  const total = useMemo(() => subtotal + (cart.length ? deliveryFee : 0), [subtotal, deliveryFee, cart.length]);
  const cartCount = useMemo(() => cart.reduce((s, i) => s + i.qty, 0), [cart]);

  const paidMessage = useMemo(() => {
    const lines = cart.map((i) => `${i.qty}x ${i.name} — Size ${i.size} (${i.code})`);
    return `Hi Uncharted, I've sent ${naira(total)} via ${BANK.bank} for:\n${lines.join("\n")}\n\nDelivery to: ${location} (${naira(deliveryFee)})\n\nAttaching my receipt now.`;
  }, [cart, total, location, deliveryFee]);

  const [copied, setCopied] = useState(false);
  const [showBankDetails, setShowBankDetails] = useState(false);
  const copyAccountNumber = () => {
    navigator.clipboard?.writeText(BANK.accountNumber).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  };

  const waLink = (msg) => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;

  const navLinks = ["Shop", "Lookbook", "About", "Contact"];

  const scrollToId = (id) => (e) => {
    e.preventDefault();
    setMenuOpen(false);
    // wait a tick so the mobile menu closes before we measure/scroll
    requestAnimationFrame(() => {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  };

  return (
    <div style={{ background: C.bg, color: C.paper, fontFamily: "'Inter', sans-serif" }} className="min-h-screen">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        ::selection { background: ${C.brass}; color: ${C.bg}; }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; }
        section, footer { scroll-margin-top: 88px; }
        @media (prefers-reduced-motion: reduce) {
          html { scroll-behavior: auto; }
          * { animation: none !important; transition: none !important; }
        }
      `}</style>

      {/* NAV */}
      <header style={{ borderBottom: `1px solid ${C.line}`, background: C.bg }} className="sticky top-0 z-40">
        <div className="max-w-6xl mx-auto flex items-center justify-between px-5 py-4">
          <a href="#top" onClick={scrollToId("top")} className="flex items-center gap-2">
            <img src={LOGO_SRC} alt="Uncharted" style={{ height: 28, width: "auto" }} />
            <span style={{ fontFamily: "'Anton', sans-serif" }} className="text-2xl tracking-tight uppercase">
              Uncharted
            </span>
          </a>
          <nav className="hidden md:flex items-center gap-8">
            {navLinks.map((l) => (
              <a
                key={l}
                href={`#${l.toLowerCase()}`}
                onClick={scrollToId(l.toLowerCase())}
                style={{ color: C.paperDim, fontFamily: "'Space Mono', monospace" }}
                className="text-xs uppercase tracking-widest transition-colors"
                onMouseEnter={(e) => (e.currentTarget.style.color = C.paper)}
                onMouseLeave={(e) => (e.currentTarget.style.color = C.paperDim)}
              >
                {l}
              </a>
            ))}
          </nav>
          <div className="flex items-center gap-4">
            <button
              onClick={() => setCartOpen(true)}
              aria-label="Open cart"
              className="relative flex items-center gap-2"
              style={{ color: C.paper }}
            >
              <ShoppingBag size={20} />
              {cartCount > 0 && (
                <span
                  style={{ background: C.brass, color: C.bg, fontSize: 10 }}
                  className="absolute -top-2 -right-2 font-bold rounded-full w-4 h-4 flex items-center justify-center"
                >
                  {cartCount}
                </span>
              )}
            </button>
            <button className="md:hidden" onClick={() => setMenuOpen((v) => !v)} aria-label="Toggle menu">
              {menuOpen ? <X size={22} /> : <Menu size={22} />}
            </button>
          </div>
        </div>
        {menuOpen && (
          <div className="md:hidden flex flex-col gap-4 px-5 pb-5" style={{ borderTop: `1px solid ${C.line}` }}>
            {navLinks.map((l) => (
              <a
                key={l}
                href={`#${l.toLowerCase()}`}
                onClick={scrollToId(l.toLowerCase())}
                style={{ color: C.paperDim, fontFamily: "'Space Mono', monospace" }}
                className="text-xs uppercase tracking-widest pt-3"
              >
                {l}
              </a>
            ))}
          </div>
        )}
      </header>

      <Marquee />

      {/* HERO */}
      <section id="top" style={{ position: "relative", borderBottom: `1px solid ${C.line}` }} className="overflow-hidden">
        <ContourField opacity={0.6} />
        <div className="max-w-6xl mx-auto px-5 py-24 md:py-36 relative">
          <div className="flex items-center gap-2 mb-6" style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }}>
            <Compass size={16} />
            <span className="text-xs uppercase tracking-widest">Ibadan · Coordinates unknown</span>
          </div>
          <h1
            style={{ fontFamily: "'Anton', sans-serif", lineHeight: 0.92, fontSize: "clamp(3rem, 11vw, 7.5rem)" }}
            className="uppercase tracking-tight"
          >
            Define your
            <br />
            <span style={{ WebkitTextStroke: `1.5px ${C.paper}`, color: "transparent" }}>own path.</span>
          </h1>
          <p style={{ color: C.paperDim }} className="max-w-md mt-8 text-base leading-relaxed">
            Clothing for people who left the trail behind. Every piece is a marker on a route
            nobody's charted yet.
          </p>
          <div className="flex flex-wrap gap-4 mt-10">
            <a
              href="#shop"
              onClick={scrollToId("shop")}
              style={{ background: C.brass, color: C.bg }}
              className="px-6 py-3 text-xs font-bold uppercase tracking-widest inline-flex items-center gap-2"
            >
              Shop the drop <ArrowUpRight size={14} />
            </a>
            <a
              href={waLink("Hi Uncharted, I have a question about the store.")}
              target="_blank"
              rel="noopener noreferrer"
              style={{ border: `1px solid ${C.line}`, color: C.paper }}
              className="px-6 py-3 text-xs font-bold uppercase tracking-widest inline-flex items-center gap-2"
            >
              <MessageCircle size={14} /> Chat with us
            </a>
          </div>
        </div>
      </section>

      {/* SHOP */}
      <section id="shop" className="max-w-6xl mx-auto px-5 py-20">
        <div className="flex items-end justify-between mb-10 flex-wrap gap-4">
          <div>
            <span style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }} className="text-xs uppercase tracking-widest">
              Current drop
            </span>
            <h2 style={{ fontFamily: "'Anton', sans-serif" }} className="text-4xl md:text-5xl uppercase mt-2">
              The Field Collection
            </h2>
          </div>
          <p style={{ color: C.paperDim }} className="text-sm max-w-xs">
            Two colorways. Same statement. Grab yours before the route closes.
          </p>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 max-w-3xl">
          {PRODUCTS.map((p) => (
            <ProductCard key={p.id} p={p} onAdd={addToCart} />
          ))}
        </div>
      </section>

      {/* ABOUT */}
      <section id="about" style={{ borderTop: `1px solid ${C.line}`, borderBottom: `1px solid ${C.line}`, background: C.surface }}>
        <div className="max-w-6xl mx-auto px-5 py-24 grid md:grid-cols-2 gap-12 items-center">
          <div>
            <span style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }} className="text-xs uppercase tracking-widest">
              About the brand
            </span>
            <h2 style={{ fontFamily: "'Anton', sans-serif" }} className="text-3xl md:text-4xl uppercase mt-3 mb-6 leading-tight">
              Built off the beaten path
            </h2>
            <p style={{ color: C.paperDim }} className="leading-relaxed mb-4">
              Uncharted started with one idea: the best routes aren't on any map. We design for
              people who set their own coordinates — streetwear built with the same care as
              expedition gear, cut for the city.
            </p>
            <p style={{ color: C.paperDim }} className="leading-relaxed">
              Every drop is small, numbered, and gone once it's gone. No restocks. No shortcuts.
            </p>
          </div>
          <div style={{ position: "relative", height: 320, border: `1px solid ${C.line}`, background: `linear-gradient(160deg, #2a2a22, #0f0e0b)` }}>
            <ContourField opacity={0.8} />
            <div className="absolute inset-0 flex items-center justify-center">
              <MapPin size={48} style={{ color: C.brass }} />
            </div>
          </div>
        </div>
      </section>

      {/* LOOKBOOK */}
      <section id="lookbook" className="max-w-6xl mx-auto px-5 py-20">
        <span style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }} className="text-xs uppercase tracking-widest">
          Lookbook
        </span>
        <h2 style={{ fontFamily: "'Anton', sans-serif" }} className="text-4xl uppercase mt-2 mb-10">
          Field Notes
        </h2>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          {[
            { src: PRODUCTS[0].front, alt: "White polo — front" },
            { src: PRODUCTS[0].back, alt: "White polo — back" },
            { src: PRODUCTS[1].front, alt: "Black polo — front" },
            { src: PRODUCTS[1].back, alt: "Black polo — back" },
          ].map((img, idx) => (
            <div
              key={idx}
              style={{ height: 280, border: `1px solid ${C.line}`, position: "relative", overflow: "hidden", background: C.bg }}
            >
              <img src={img.src} alt={img.alt} style={{ width: "100%", height: "100%", objectFit: "cover", objectPosition: "top" }} />
            </div>
          ))}
        </div>
      </section>

      {/* NEWSLETTER */}
      <section style={{ borderTop: `1px solid ${C.line}`, borderBottom: `1px solid ${C.line}`, background: C.surface }}>
        <div className="max-w-6xl mx-auto px-5 py-16 flex flex-col md:flex-row items-center justify-between gap-6">
          <div>
            <h3 style={{ fontFamily: "'Anton', sans-serif" }} className="text-2xl uppercase">
              Get the next drop first
            </h3>
            <p style={{ color: C.paperDim }} className="text-sm mt-1">No spam. Just coordinates for the next release.</p>
          </div>
          {subscribed ? (
            <p style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }} className="text-sm">You're on the list.</p>
          ) : (
            <form
              onSubmit={(e) => {
                e.preventDefault();
                if (email.trim()) setSubscribed(true);
              }}
              className="flex w-full md:w-auto gap-3"
            >
              <input
                type="email"
                required
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="your@email.com"
                style={{ background: C.bg, border: `1px solid ${C.line}`, color: C.paper }}
                className="px-4 py-3 text-sm flex-1 md:w-64 outline-none"
              />
              <button
                type="submit"
                style={{ background: C.brass, color: C.bg }}
                className="px-5 py-3 text-xs font-bold uppercase tracking-widest whitespace-nowrap"
              >
                Sign up
              </button>
            </form>
          )}
        </div>
      </section>

      {/* CONTACT / FOOTER */}
      <footer id="contact" className="max-w-6xl mx-auto px-5 py-16">
        <div className="grid md:grid-cols-3 gap-10">
          <div>
            <div className="flex items-center gap-2 mb-4">
              <img src={LOGO_SRC} alt="Uncharted" style={{ height: 26, width: "auto" }} />
              <h3 style={{ fontFamily: "'Anton', sans-serif" }} className="text-2xl uppercase">
                Uncharted
              </h3>
            </div>
            <p style={{ color: C.paperDim }} className="text-sm leading-relaxed">
              Streetwear for the unmapped route. Based in Lagos, shipped from wherever the drop lands.
            </p>
          </div>
          <div>
            <span style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }} className="text-xs uppercase tracking-widest">
              Reach us
            </span>
            <ul className="mt-4 flex flex-col gap-3 text-sm">
              <li>
                <a href={`mailto:${EMAIL}`} className="flex items-center gap-2" style={{ color: C.paperDim }}>
                  <Mail size={15} /> {EMAIL}
                </a>
              </li>
              <li>
                <a href={waLink("Hi Uncharted, I have a question.")} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2" style={{ color: C.paperDim }}>
                  <MessageCircle size={15} /> WhatsApp: 0904 364 4867
                </a>
              </li>
            </ul>
          </div>
          <div>
            <span style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }} className="text-xs uppercase tracking-widest">
              Follow the route
            </span>
            <ul className="mt-4 flex flex-col gap-3 text-sm">
              <li>
                <a href={IG} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2" style={{ color: C.paperDim }}>
                  <Instagram size={15} /> @unch4rted.shop
                </a>
              </li>
              <li>
                <a href={SNAP} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2" style={{ color: C.paperDim }}>
                  <span style={{ width: 15, display: "inline-block", textAlign: "center" }}>👻</span> Trz_unch4rted
                </a>
              </li>
              <li>
                <a href={TT} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2" style={{ color: C.paperDim }}>
                  <span style={{ width: 15, display: "inline-block", textAlign: "center" }}>♪</span> Uncharted.shop
                </a>
              </li>
            </ul>
          </div>
        </div>
        <div style={{ borderTop: `1px solid ${C.line}`, color: C.paperDim }} className="mt-12 pt-6 text-xs flex flex-col md:flex-row justify-between gap-2">
          <span>© {new Date().getFullYear()} Uncharted. All routes reserved.</span>
          <span style={{ fontFamily: "'Space Mono', monospace" }}>LAT 6.5244° N · LON 3.3792° E</span>
        </div>
      </footer>

      {/* FLOATING WHATSAPP */}
      <a
        href={waLink("Hi Uncharted, I'd like to place an order.")}
        target="_blank"
        rel="noopener noreferrer"
        style={{ background: "#25D366", color: "#0A0A08" }}
        className="fixed bottom-5 right-5 z-40 w-14 h-14 rounded-full flex items-center justify-center shadow-lg"
        aria-label="Chat on WhatsApp"
      >
        <MessageCircle size={26} />
      </a>

      {/* CART DRAWER */}
      {cartOpen && (
        <div className="fixed inset-0 z-50 flex justify-end">
          <div
            onClick={() => setCartOpen(false)}
            style={{ background: "rgba(0,0,0,0.6)" }}
            className="absolute inset-0"
          />
          <div style={{ background: C.surface, borderLeft: `1px solid ${C.line}`, width: "100%", maxWidth: 400 }} className="relative h-full flex flex-col">
            <div style={{ borderBottom: `1px solid ${C.line}` }} className="flex items-center justify-between p-5">
              <h3 style={{ fontFamily: "'Anton', sans-serif" }} className="text-xl uppercase">Your bag</h3>
              <button onClick={() => setCartOpen(false)} aria-label="Close cart"><X size={22} /></button>
            </div>
            <div className="flex-1 overflow-y-auto p-5 flex flex-col gap-5">
              {cart.length === 0 && (
                <p style={{ color: C.paperDim }} className="text-sm">Nothing charted yet. Add a piece to get started.</p>
              )}
              {cart.map((i) => (
                <div key={i.cartKey} className="flex gap-3">
                  <img src={i.front} alt={i.name} style={{ width: 64, height: 64, objectFit: "cover", objectPosition: "top", border: `1px solid ${C.line}`, flexShrink: 0 }} />
                  <div className="flex-1">
                    <div className="flex items-start justify-between gap-2">
                      <p style={{ color: C.paper }} className="text-sm font-medium">{i.name}</p>
                      <button onClick={() => removeItem(i.cartKey)} aria-label={`Remove ${i.name}`}>
                        <Trash2 size={15} style={{ color: C.paperDim }} />
                      </button>
                    </div>
                    <p style={{ color: C.paperDim, fontFamily: "'Space Mono', monospace" }} className="text-xs mt-1">{i.code} · Size {i.size} · {naira(i.price)}</p>
                    <div className="flex items-center gap-3 mt-2">
                      <button onClick={() => changeQty(i.cartKey, -1)} style={{ border: `1px solid ${C.line}` }} className="w-6 h-6 flex items-center justify-center">
                        <Minus size={12} />
                      </button>
                      <span style={{ fontFamily: "'Space Mono', monospace" }} className="text-xs">{i.qty}</span>
                      <button onClick={() => changeQty(i.cartKey, 1)} style={{ border: `1px solid ${C.line}` }} className="w-6 h-6 flex items-center justify-center">
                        <Plus size={12} />
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{ borderTop: `1px solid ${C.line}` }} className="p-5">
              <div className="mb-4">
                <span style={{ color: C.paperDim, fontFamily: "'Space Mono', monospace" }} className="text-xs uppercase tracking-widest">
                  Delivery location
                </span>
                <select
                  value={location}
                  onChange={(e) => setLocation(e.target.value)}
                  style={{ background: C.bg, border: `1px solid ${C.line}`, color: C.paper }}
                  className="w-full mt-2 px-3 py-2 text-sm outline-none"
                >
                  {DELIVERY.map((d) => (
                    <option key={d.label} value={d.label}>
                      {d.label} — {naira(d.fee)}
                    </option>
                  ))}
                </select>
              </div>

              <div className="flex items-center justify-between text-sm mb-1">
                <span style={{ color: C.paperDim }}>Subtotal</span>
                <span style={{ color: C.paper, fontFamily: "'Space Mono', monospace" }}>{naira(subtotal)}</span>
              </div>
              <div className="flex items-center justify-between text-sm mb-3">
                <span style={{ color: C.paperDim }}>Delivery ({location})</span>
                <span style={{ color: C.paper, fontFamily: "'Space Mono', monospace" }}>{naira(cart.length ? deliveryFee : 0)}</span>
              </div>
              <div className="flex items-center justify-between mb-4" style={{ borderTop: `1px solid ${C.line}`, paddingTop: 10 }}>
                <span style={{ color: C.paperDim }} className="text-sm uppercase tracking-widest">Total</span>
                <span style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }} className="text-lg">{naira(total)}</span>
              </div>

              <div
                style={{ background: "rgba(201,162,39,0.1)", border: `1px solid ${C.brass}` }}
                className="flex items-start gap-2 p-3 mb-4"
              >
                <AlertTriangle size={16} style={{ color: C.brass, flexShrink: 0, marginTop: 1 }} />
                <p style={{ color: C.brass }} className="text-xs font-bold uppercase tracking-wide leading-snug">
                  Important! Save a screenshot of your receipt before confirming, and attach it when you message us on WhatsApp — you'll need it if there's ever an issue with your order.
                </p>
              </div>

              <button
                onClick={() => setShowBankDetails((v) => !v)}
                style={{ border: `1px solid ${C.brass}`, color: C.brass, background: showBankDetails ? "rgba(201,162,39,0.1)" : "transparent" }}
                className="w-full flex items-center justify-between px-4 py-3 mb-3 text-xs font-bold uppercase tracking-widest"
              >
                Pay via Transfer
                {showBankDetails ? <Minus size={14} /> : <Plus size={14} />}
              </button>

              {showBankDetails && (
                <>
                  <div style={{ background: C.bg, border: `1px solid ${C.line}` }} className="p-4 mb-3">
                    <div className="flex items-center justify-between text-sm mb-2">
                      <span style={{ color: C.paperDim }}>Bank</span>
                      <span style={{ color: C.paper }}>{BANK.bank}</span>
                    </div>
                    <div className="flex items-center justify-between text-sm mb-2">
                      <span style={{ color: C.paperDim }}>Account name</span>
                      <span style={{ color: C.paper }}>{BANK.accountName}</span>
                    </div>
                    <div className="flex items-center justify-between text-sm">
                      <span style={{ color: C.paperDim }}>Account number</span>
                      <button
                        onClick={copyAccountNumber}
                        style={{ color: C.brass, fontFamily: "'Space Mono', monospace" }}
                        className="font-bold"
                      >
                        {copied ? "Copied!" : BANK.accountNumber}
                      </button>
                    </div>
                  </div>
                  <a
                    href={waLink(paidMessage)}
                    target="_blank"
                    rel="noopener noreferrer"
                    style={{ background: cart.length ? C.brass : C.line, color: cart.length ? C.bg : C.paperDim, pointerEvents: cart.length ? "auto" : "none" }}
                    className="w-full flex items-center justify-center gap-2 py-3 text-xs font-bold uppercase tracking-widest"
                  >
                    <MessageCircle size={14} /> I've paid — confirm on WhatsApp
                  </a>
                  <p style={{ color: C.paperDim, fontSize: 11 }} className="mt-3 text-center">
                    Transfer the total above, then tap to send us your receipt on WhatsApp.
                  </p>
                </>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<UnchartedStore />);
</script>
</body>
</html>
